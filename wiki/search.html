<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Agent Memory from Scratch 中文电子书"><title>搜索 · Agent Memory from Scratch</title><link rel="stylesheet" href="assets/wiki.css"></head><body><a class="skip" href="#main">跳到正文</a><div class="shell"><header class="topbar"><a class="brand" href="index.html">Agent Memory</a><span class="spacer"></span><a class="control hide-mobile" href="search.html">搜索</a><button class="control" data-size="-1" aria-label="减小字号">A−</button><button class="control" data-size="1" aria-label="增大字号">A＋</button></header><main id="main" class="search"><div class="eyebrow">全书检索</div><h1 class="chapter-title">搜索</h1><input class="search-input" type="search" autofocus placeholder="输入概念、项目或机制" aria-label="搜索电子书"><div id="results"></div></main></div><script>fetch('assets/search-index.json').then(r=>r.json()).then(d=>{const i=document.querySelector('.search-input'),o=document.querySelector('#results');function run(){const q=i.value.trim().toLowerCase();if(!q){o.innerHTML='<p class="meta">搜索标题与正文。</p>';return}const hits=d.map(x=>({...x,pos:(x.title+' '+x.text).toLowerCase().indexOf(q)})).filter(x=>x.pos>=0).slice(0,30);o.innerHTML=hits.map(x=>{const p=Math.max(0,x.pos-70);return '<article class="result"><a href="chapters/'+x.slug+'.html">'+x.title+'</a><p>'+x.text.slice(p,p+220)+'</p></article>'}).join('')||'<p class="meta">没有结果。</p>'}i.addEventListener('input',run);run()})</script><script src="assets/wiki.js"></script></body></html>
