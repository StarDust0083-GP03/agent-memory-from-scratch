<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 408" role="img" aria-labelledby="record-card-title record-card-desc">
<title id="record-card-title">让一条记忆可管理</title>
<desc id="record-card-desc">一条代码修改规则除了正文，还需身份与范围、来源、有效时间，才能限定谁能使用、依据什么以及何时适用。</desc>
<style>svg{--paper:#faf7ef;--ink:#252820;--muted:#696b61;--accent:#29564c;--rule:#d9d2c3;color:var(--ink);font-family:system-ui,sans-serif}text{fill:currentColor;font-size:20px}path,line,rect,circle,ellipse{stroke:currentColor;stroke-width:1.5} .small{font-size:17px;fill:var(--muted)}.focal{color:var(--accent)}.paper{fill:var(--paper)}.rule{stroke:var(--rule)}@media(prefers-color-scheme:dark){svg{--paper:#151512;--ink:#e5e0d5;--muted:#aaa79d;--accent:#87b7a8;--rule:#39382f}}</style>
<defs><marker id="record-card-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="context-stroke"/></marker></defs>

<rect class="paper" x="28" y="20" width="384" height="356" rx="6"/>
<path class="rule" d="M28 116H412M28 196H412M28 276H412" fill="none"/>
<g class="focal"><text x="52" y="56" text-anchor="start" class="">正文</text><text x="52" y="88" text-anchor="start" class="">合并代码前跑提醒测试</text></g>
<text x="52" y="150" text-anchor="start" class="">属于谁？</text><text x="52" y="180" text-anchor="start" class="small">Alice / Todo</text>
<text x="52" y="230" text-anchor="start" class="">依据什么？</text><text x="52" y="260" text-anchor="start" class="small">原话 session-42</text>
<text x="52" y="310" text-anchor="start" class="">什么时候适用？</text><text x="52" y="340" text-anchor="start" class="small">9 月 18 日起，待变更时结束</text>

</svg>
