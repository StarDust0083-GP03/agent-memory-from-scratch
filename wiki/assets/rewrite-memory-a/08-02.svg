<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">小核心常驻与大资料按需打开</title><desc id="desc">根部 MEMORY.md：精简索引和行为底线，写明何时该去翻哪份笔记；子目录与 recall：详细故障复盘与历史对话按需用工具拉取；新失败模式：模型忘了调工具或只看摘要就瞎猜，需端到端评测</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">小核心常驻与大资料按需打开</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">根部 MEMORY.md</text><text x="270" y="139" font-size="18" fill="#243b48">精简索引和行为底线，写明何时该去翻哪份笔记</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">子目录与 recall</text><text x="270" y="239" font-size="18" fill="#243b48">详细故障复盘与历史对话按需用工具拉取</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">新失败模式</text><text x="270" y="339" font-size="18" fill="#243b48">模型忘了调工具或只看摘要就瞎猜，需端到端评测</text></g></svg>
