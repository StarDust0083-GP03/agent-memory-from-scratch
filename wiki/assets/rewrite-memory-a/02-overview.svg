<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">按未来怎么读来设计数据模型</title><desc id="desc">稳定偏好：直接按用户读取，允许单次对话临时覆盖；过往经历：带时间、结果和来源，按需检索回溯；长期规程：明确服务、触发条件与版本，禁止丢限定词</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">按未来怎么读来设计数据模型</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">稳定偏好</text><text x="270" y="139" font-size="18" fill="#243b48">直接按用户读取，允许单次对话临时覆盖</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">过往经历</text><text x="270" y="239" font-size="18" fill="#243b48">带时间、结果和来源，按需检索回溯</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">长期规程</text><text x="270" y="339" font-size="18" fill="#243b48">明确服务、触发条件与版本，禁止丢限定词</text></g></svg>
