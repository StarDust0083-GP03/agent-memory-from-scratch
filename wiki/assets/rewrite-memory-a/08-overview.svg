<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">从零散经验升级为可执行 Skill</title><desc id="desc">明确合同：补齐触发条件、入参、只读检查与停止边界；反例回放：同时测正常发版、dry-run 演示、缺权限与异常回滚；审核与版本发布：文本回滚不能撤销已发出的生产变更</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">从零散经验升级为可执行 Skill</text><circle cx="58" cy="130" r="22" fill="#285d75"/><text x="52" y="137" font-size="21" fill="white">1</text><rect x="105" y="100" width="745" height="85" fill="#e8ede7"/><text x="122" y="128" font-size="19" fill="#243b48">明确合同</text><text x="122" y="157" font-size="18" fill="#243b48">补齐触发条件、入参、只读检查与停止边界</text><path d="M58 153 V182" stroke="#285d75" stroke-width="2"/><path d="M52 176 L58 185 L64 176" fill="none" stroke="#285d75" stroke-width="2"/><circle cx="58" cy="235" r="22" fill="#285d75"/><text x="52" y="242" font-size="21" fill="white">2</text><rect x="105" y="205" width="745" height="85" fill="#e8ede7"/><text x="122" y="233" font-size="19" fill="#243b48">反例回放</text><text x="122" y="262" font-size="18" fill="#243b48">同时测正常发版、dry-run 演示、缺权限与异常回滚</text><path d="M58 258 V287" stroke="#285d75" stroke-width="2"/><path d="M52 281 L58 290 L64 281" fill="none" stroke="#285d75" stroke-width="2"/><circle cx="58" cy="340" r="22" fill="#285d75"/><text x="52" y="347" font-size="21" fill="white">3</text><rect x="105" y="310" width="745" height="85" fill="#e8ede7"/><text x="122" y="338" font-size="19" fill="#243b48">审核与版本发布</text><text x="122" y="367" font-size="18" fill="#243b48">文本回滚不能撤销已发出的生产变更</text></g></svg>
