<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">双时间知识图谱的四项必查清单</title><desc id="desc">业务有效轴：[valid_at, invalid_at) 左闭右开回答现实归属；系统录入轴：created_at / expired_at 解释当时为何给旧答案；实体与来源：规范 UUID 防串台，episodes 随时回查原文</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">双时间知识图谱的四项必查清单</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">业务有效轴</text><text x="270" y="139" font-size="18" fill="#243b48">[valid_at, invalid_at) 左闭右开回答现实归属</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">系统录入轴</text><text x="270" y="239" font-size="18" fill="#243b48">created_at / expired_at 解释当时为何给旧答案</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">实体与来源</text><text x="270" y="339" font-size="18" fill="#243b48">规范 UUID 防串台，episodes 随时回查原文</text></g></svg>
