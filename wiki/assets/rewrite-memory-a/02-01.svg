<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">一句话里的四类不同记忆</title><desc id="desc">长期偏好：林远习惯中文回复、改配置前先给 diff；单次工作状态：今天演示环境只跑 dry-run，别真发版；过往经历与规程：上次漏查幂等键出事故，以后发版前必查</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">一句话里的四类不同记忆</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">长期偏好</text><text x="270" y="139" font-size="18" fill="#243b48">林远习惯中文回复、改配置前先给 diff</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">单次工作状态</text><text x="270" y="239" font-size="18" fill="#243b48">今天演示环境只跑 dry-run，别真发版</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">过往经历与规程</text><text x="270" y="339" font-size="18" fill="#243b48">上次漏查幂等键出事故，以后发版前必查</text></g></svg>
