<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">外部存储与模型窗口的边界</title><desc id="desc">数据库里的历史：昨天的发布复盘安稳躺在磁盘里；本次调用的 Prompt：没拼进消息列表，模型就完全看不见；跨会话交接：检索挑出几条短证据，显式注入当前输入</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">外部存储与模型窗口的边界</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">数据库里的历史</text><text x="270" y="139" font-size="18" fill="#243b48">昨天的发布复盘安稳躺在磁盘里</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">本次调用的 Prompt</text><text x="270" y="239" font-size="18" fill="#243b48">没拼进消息列表，模型就完全看不见</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">跨会话交接</text><text x="270" y="339" font-size="18" fill="#243b48">检索挑出几条短证据，显式注入当前输入</text></g></svg>
