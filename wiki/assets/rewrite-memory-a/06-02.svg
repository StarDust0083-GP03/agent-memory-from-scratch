<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">同名服务消歧与别名归一</title><desc id="desc">同名不同物：核心支付组与大客户组都有 billing-api，严禁合并；同物不同名：支付网关与 payment-gateway 需归到同一 UUID；实体错则全盘错：端点合错后，时间区间再准也会全线串台</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">同名服务消歧与别名归一</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">同名不同物</text><text x="270" y="139" font-size="18" fill="#243b48">核心支付组与大客户组都有 billing-api，严禁合并</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">同物不同名</text><text x="270" y="239" font-size="18" fill="#243b48">支付网关与 payment-gateway 需归到同一 UUID</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">实体错则全盘错</text><text x="270" y="339" font-size="18" fill="#243b48">端点合错后，时间区间再准也会全线串台</text></g></svg>
