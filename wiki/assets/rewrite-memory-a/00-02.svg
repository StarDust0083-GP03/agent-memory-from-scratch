<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">同一份故障复盘里的三种对象</title><desc id="desc">原始事件 Episode：保留排查日志与告警原话，供回溯；规范实体 Entity：核心支付组的 payment-gateway，不靠名字瞎猜；事实关系 Edge：谁维护、谁审批，带来源和有效区间</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">同一份故障复盘里的三种对象</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">原始事件 Episode</text><text x="270" y="139" font-size="18" fill="#243b48">保留排查日志与告警原话，供回溯</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">规范实体 Entity</text><text x="270" y="239" font-size="18" fill="#243b48">核心支付组的 payment-gateway，不靠名字瞎猜</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">事实关系 Edge</text><text x="270" y="339" font-size="18" fill="#243b48">谁维护、谁审批，带来源和有效区间</text></g></svg>
