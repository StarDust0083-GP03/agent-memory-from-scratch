<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">三种冲突必须走三种处理路径</title><desc id="desc">真实职责演进：11 月 1 日老张交接给老李，关闭旧区间开新区间；来源彼此打架：告警单与群消息矛盾，并存双源等待核实；模型抽取翻车：把临时顶班抽成永久接任，回源重抽修正</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">三种冲突必须走三种处理路径</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">真实职责演进</text><text x="270" y="139" font-size="18" fill="#243b48">11 月 1 日老张交接给老李，关闭旧区间开新区间</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">来源彼此打架</text><text x="270" y="239" font-size="18" fill="#243b48">告警单与群消息矛盾，并存双源等待核实</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">模型抽取翻车</text><text x="270" y="339" font-size="18" fill="#243b48">把临时顶班抽成永久接任，回源重抽修正</text></g></svg>
