<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">四种淡出和删除语义绝对不能混</title><desc id="desc">连续衰减半衰期：只降排序权重，不代表安全规程失效；到期隐藏：Mem0 expiration_date 退出默认展示，库里仍在；现实失效与真删除：invalid_at 表关系结束，隐私删除清全部副本</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">四种淡出和删除语义绝对不能混</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">连续衰减半衰期</text><text x="270" y="139" font-size="18" fill="#243b48">只降排序权重，不代表安全规程失效</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">到期隐藏</text><text x="270" y="239" font-size="18" fill="#243b48">Mem0 expiration_date 退出默认展示，库里仍在</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">现实失效与真删除</text><text x="270" y="339" font-size="18" fill="#243b48">invalid_at 表关系结束，隐私删除清全部副本</text></g></svg>
