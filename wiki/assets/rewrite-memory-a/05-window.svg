<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">12000 Token 窗口里真正留给记忆的空间</title><desc id="desc">固定与当前开销：系统与工具说明 3000 + 当前对话 2500；必须预留的未来空间：模型回答 2000 + 工具往返 2500；实际记忆预算：仅剩 2000 Token，成组证据需整体保留</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">12000 Token 窗口里真正留给记忆的空间</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">固定与当前开销</text><text x="270" y="139" font-size="18" fill="#243b48">系统与工具说明 3000 + 当前对话 2500</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">必须预留的未来空间</text><text x="270" y="239" font-size="18" fill="#243b48">模型回答 2000 + 工具往返 2500</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">实际记忆预算</text><text x="270" y="339" font-size="18" fill="#243b48">仅剩 2000 Token，成组证据需整体保留</text></g></svg>
