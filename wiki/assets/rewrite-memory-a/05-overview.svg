<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">从搜不到一步步定位故障层</title><desc id="desc">查存在与权限：先按 ID 确认记录存在且对当前用户可见；查初选与融合：分清没进候选池、被门槛刷掉还是排太靠后；查打包与使用：搜到却被预算挤掉，换向量模型也救不了</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">从搜不到一步步定位故障层</text><circle cx="58" cy="130" r="22" fill="#285d75"/><text x="52" y="137" font-size="21" fill="white">1</text><rect x="105" y="100" width="745" height="85" fill="#e8ede7"/><text x="122" y="128" font-size="19" fill="#243b48">查存在与权限</text><text x="122" y="157" font-size="18" fill="#243b48">先按 ID 确认记录存在且对当前用户可见</text><path d="M58 153 V182" stroke="#285d75" stroke-width="2"/><path d="M52 176 L58 185 L64 176" fill="none" stroke="#285d75" stroke-width="2"/><circle cx="58" cy="235" r="22" fill="#285d75"/><text x="52" y="242" font-size="21" fill="white">2</text><rect x="105" y="205" width="745" height="85" fill="#e8ede7"/><text x="122" y="233" font-size="19" fill="#243b48">查初选与融合</text><text x="122" y="262" font-size="18" fill="#243b48">分清没进候选池、被门槛刷掉还是排太靠后</text><path d="M58 258 V287" stroke="#285d75" stroke-width="2"/><path d="M52 281 L58 290 L64 281" fill="none" stroke="#285d75" stroke-width="2"/><circle cx="58" cy="340" r="22" fill="#285d75"/><text x="52" y="347" font-size="21" fill="white">3</text><rect x="105" y="310" width="745" height="85" fill="#e8ede7"/><text x="122" y="338" font-size="19" fill="#243b48">查打包与使用</text><text x="122" y="367" font-size="18" fill="#243b48">搜到却被预算挤掉，换向量模型也救不了</text></g></svg>
