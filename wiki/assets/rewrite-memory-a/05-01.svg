<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">精确报错码在两类混合检索里的命运</title><desc id="desc">向量初选池：只捞回语义相近的 A 和 C，漏掉带 PAY-409 的 B；先并集再 RRF：Graphiti / MCP 合并两路，B 稳稳进场评分；只在语义池加分：Mem0 OSS 仅遍历向量池，B 连入场券都没有</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">精确报错码在两类混合检索里的命运</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">向量初选池</text><text x="270" y="139" font-size="18" fill="#243b48">只捞回语义相近的 A 和 C，漏掉带 PAY-409 的 B</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">先并集再 RRF</text><text x="270" y="239" font-size="18" fill="#243b48">Graphiti / MCP 合并两路，B 稳稳进场评分</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">只在语义池加分</text><text x="270" y="339" font-size="18" fill="#243b48">Mem0 OSS 仅遍历向量池，B 连入场券都没有</text></g></svg>
