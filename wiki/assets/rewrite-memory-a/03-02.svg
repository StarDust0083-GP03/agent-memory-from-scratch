<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">三种重复与两种更新视图</title><desc id="desc">字节与语义去重：Hash 只能拦逐字重复，同义句靠召回比对；追加新卡 ADD-only：Mem0 OSS 默认不自动关旧卡，读端管版本；状态区间切换：正式交接关旧区间，临时顶班不伤长期默认</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">三种重复与两种更新视图</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">字节与语义去重</text><text x="270" y="139" font-size="18" fill="#243b48">Hash 只能拦逐字重复，同义句靠召回比对</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">追加新卡 ADD-only</text><text x="270" y="239" font-size="18" fill="#243b48">Mem0 OSS 默认不自动关旧卡，读端管版本</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">状态区间切换</text><text x="270" y="339" font-size="18" fill="#243b48">正式交接关旧区间，临时顶班不伤长期默认</text></g></svg>
