<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">显式替代与软遗忘的边界</title><desc id="desc">supersedes 替代：写旧行 valid_to 并插新行，历史仍可查；forget-decayed 预览：默认 dry-run 列低强度候选，不真删正文；真实生产差距：缺可信认证、语义模型与合规物理删除</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">显式替代与软遗忘的边界</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">supersedes 替代</text><text x="270" y="139" font-size="18" fill="#243b48">写旧行 valid_to 并插新行，历史仍可查</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">forget-decayed 预览</text><text x="270" y="239" font-size="18" fill="#243b48">默认 dry-run 列低强度候选，不真删正文</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">真实生产差距</text><text x="270" y="339" font-size="18" fill="#243b48">缺可信认证、语义模型与合规物理删除</text></g></svg>
