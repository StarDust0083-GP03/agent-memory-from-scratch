<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">拆穿记忆项目宣传词的四问契约</title><desc id="desc">它吃什么进去：原始对话、工具 Trace 还是手工 Markdown；它落盘存什么：短事实卡片、双时间边、用户画像还是文件树；它吐什么与谁收尾：候选文本还是现成答案，权限和组装谁负责</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">拆穿记忆项目宣传词的四问契约</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">它吃什么进去</text><text x="270" y="139" font-size="18" fill="#243b48">原始对话、工具 Trace 还是手工 Markdown</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">它落盘存什么</text><text x="270" y="239" font-size="18" fill="#243b48">短事实卡片、双时间边、用户画像还是文件树</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">它吐什么与谁收尾</text><text x="270" y="339" font-size="18" fill="#243b48">候选文本还是现成答案，权限和组装谁负责</text></g></svg>
