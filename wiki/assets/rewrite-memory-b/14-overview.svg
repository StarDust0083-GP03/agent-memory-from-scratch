<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">搭建可信评测基线的三个动作</title><desc id="desc">先跑十道真失败题：覆盖偏好、例外、精确码、两跳、晚到、越权与删除；固定预算做消融：控制相同语料、回答模型与 Token 额度，一次只改一处；拒绝伪大一统榜单：不同数据集切分与裁判模型下的分数不可直接排队</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">搭建可信评测基线的三个动作</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">先跑十道真失败题</text><text x="270" y="139" font-size="18" fill="#243b48">覆盖偏好、例外、精确码、两跳、晚到、越权与删除</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">固定预算做消融</text><text x="270" y="239" font-size="18" fill="#243b48">控制相同语料、回答模型与 Token 额度，一次只改一处</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">拒绝伪大一统榜单</text><text x="270" y="339" font-size="18" fill="#243b48">不同数据集切分与裁判模型下的分数不可直接排队</text></g></svg>
