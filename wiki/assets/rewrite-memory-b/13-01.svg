<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">四类工程接入组件各守哪道关</title><desc id="desc">MCP Memory Service：统一多端存取协议，v13.0 强化每库凭据与 as_of 查询；Basic Memory：人类可编辑 Markdown 作权威源，数据库索引可随时重建；Beacon 与 TencentDB：前者抓跨宿主工具 Trace，后者管团队 ACL 与 Loadout</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">四类工程接入组件各守哪道关</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">MCP Memory Service</text><text x="270" y="139" font-size="18" fill="#243b48">统一多端存取协议，v13.0 强化每库凭据与 as_of 查询</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">Basic Memory</text><text x="270" y="239" font-size="18" fill="#243b48">人类可编辑 Markdown 作权威源，数据库索引可随时重建</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">Beacon 与 TencentDB</text><text x="270" y="339" font-size="18" fill="#243b48">前者抓跨宿主工具 Trace，后者管团队 ACL 与 Loadout</text></g></svg>
