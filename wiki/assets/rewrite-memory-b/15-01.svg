<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">生产环境的三道硬防线</title><desc id="desc">认证授权先于检索：由服务端可信身份定范围，禁止模型自填 user_id；证据不是可执行指令：防 PR 评论夹带外发密钥，工具权限由确定性代码把关；真删除覆盖全副本：原文、向量、图边、历史表、Git 与备份恢复重放</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">生产环境的三道硬防线</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">认证授权先于检索</text><text x="270" y="139" font-size="18" fill="#243b48">由服务端可信身份定范围，禁止模型自填 user_id</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">证据不是可执行指令</text><text x="270" y="239" font-size="18" fill="#243b48">防 PR 评论夹带外发密钥，工具权限由确定性代码把关</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">真删除覆盖全副本</text><text x="270" y="339" font-size="18" fill="#243b48">原文、向量、图边、历史表、Git 与备份恢复重放</text></g></svg>
