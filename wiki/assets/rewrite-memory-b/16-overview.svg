<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">相关性、安全性与充分性绝不能互相抵消</title><desc id="desc">安全与权限门槛：夹带外发 API Key 的高相关段落必须直接一票否决；相关性排序：只在通过安全与时间门槛的集合内比谁更贴题；充分性判断：只有服务归属没有审批人时，继续补查而非硬答</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">相关性、安全性与充分性绝不能互相抵消</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">安全与权限门槛</text><text x="270" y="139" font-size="18" fill="#243b48">夹带外发 API Key 的高相关段落必须直接一票否决</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">相关性排序</text><text x="270" y="239" font-size="18" fill="#243b48">只在通过安全与时间门槛的集合内比谁更贴题</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">充分性判断</text><text x="270" y="339" font-size="18" fill="#243b48">只有服务归属没有审批人时，继续补查而非硬答</text></g></svg>
