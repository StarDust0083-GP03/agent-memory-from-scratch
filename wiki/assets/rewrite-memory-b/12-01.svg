<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">四类生命周期与 Memory OS 改的不是同一状态</title><desc id="desc">MemoryOS 分层搬运：短期溢出转中期主题页，达热度触发长期分析；Hippo 价值衰减：半衰期、outcome 反馈与 sleep 巩固，v3.12 模块化重构；A-MEM 与 MemOS：前者改写邻居描述与链接，后者调度文本/KV/LoRA 容器</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">四类生命周期与 Memory OS 改的不是同一状态</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">MemoryOS 分层搬运</text><text x="270" y="139" font-size="18" fill="#243b48">短期溢出转中期主题页，达热度触发长期分析</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">Hippo 价值衰减</text><text x="270" y="239" font-size="18" fill="#243b48">半衰期、outcome 反馈与 sleep 巩固，v3.12 模块化重构</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">A-MEM 与 MemOS</text><text x="270" y="339" font-size="18" fill="#243b48">前者改写邻居描述与链接，后者调度文本/KV/LoRA 容器</text></g></svg>
