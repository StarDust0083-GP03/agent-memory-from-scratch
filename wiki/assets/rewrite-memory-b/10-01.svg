<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">事实检索与用户画像的读写权衡</title><desc id="desc">事实卡片 Mem0：写入抽短句，读取按 query 搜，易漏跨主题偏好；用户画像 Memobase：写入批处理合并字段，读取直出，写错会反复生效；2026-11 新演进：Mem0 托管侧补齐 User Profiles 与 Dream 后台巩固</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">事实检索与用户画像的读写权衡</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">事实卡片 Mem0</text><text x="270" y="139" font-size="18" fill="#243b48">写入抽短句，读取按 query 搜，易漏跨主题偏好</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">用户画像 Memobase</text><text x="270" y="239" font-size="18" fill="#243b48">写入批处理合并字段，读取直出，写错会反复生效</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">2026-11 新演进</text><text x="270" y="339" font-size="18" fill="#243b48">Mem0 托管侧补齐 User Profiles 与 Dream 后台巩固</text></g></svg>
