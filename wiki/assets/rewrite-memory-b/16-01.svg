<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 545" role="img" aria-labelledby="title desc"><title id="title">Jev 判别闸门在检索之后的四步动作</title><desc id="desc">本地硬防线：先筛敏感密钥与已知注入，替换内部 ID 为匿名标签 P0/P1；云端轻量判别：并行给出相关性、注入风险与证据充分性三种独立信号；本地映射回填：校验合法标签后回读本地原文，长文截断与未判别显式标出；充分性驱动补查：证据不够就按白名单补搜或坦承不足，不硬编答案</desc><rect width="880" height="545" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">Jev 判别闸门在检索之后的四步动作</text><circle cx="58" cy="130" r="22" fill="#285d75"/><text x="52" y="137" font-size="21" fill="white">1</text><rect x="105" y="100" width="745" height="85" fill="#e8ede7"/><text x="122" y="128" font-size="19" fill="#243b48">本地硬防线</text><text x="122" y="157" font-size="18" fill="#243b48">先筛敏感密钥与已知注入，替换内部 ID 为匿名标签 P0/P1</text><path d="M58 153 V182" stroke="#285d75" stroke-width="2"/><path d="M52 176 L58 185 L64 176" fill="none" stroke="#285d75" stroke-width="2"/><circle cx="58" cy="235" r="22" fill="#285d75"/><text x="52" y="242" font-size="21" fill="white">2</text><rect x="105" y="205" width="745" height="85" fill="#e8ede7"/><text x="122" y="233" font-size="19" fill="#243b48">云端轻量判别</text><text x="122" y="262" font-size="18" fill="#243b48">并行给出相关性、注入风险与证据充分性三种独立信号</text><path d="M58 258 V287" stroke="#285d75" stroke-width="2"/><path d="M52 281 L58 290 L64 281" fill="none" stroke="#285d75" stroke-width="2"/><circle cx="58" cy="340" r="22" fill="#285d75"/><text x="52" y="347" font-size="21" fill="white">3</text><rect x="105" y="310" width="745" height="85" fill="#e8ede7"/><text x="122" y="338" font-size="19" fill="#243b48">本地映射回填</text><text x="122" y="367" font-size="18" fill="#243b48">校验合法标签后回读本地原文，长文截断与未判别显式标出</text><path d="M58 363 V392" stroke="#285d75" stroke-width="2"/><path d="M52 386 L58 395 L64 386" fill="none" stroke="#285d75" stroke-width="2"/><circle cx="58" cy="445" r="22" fill="#285d75"/><text x="52" y="452" font-size="21" fill="white">4</text><rect x="105" y="415" width="745" height="85" fill="#e8ede7"/><text x="122" y="443" font-size="19" fill="#243b48">充分性驱动补查</text><text x="122" y="472" font-size="18" fill="#243b48">证据不够就按白名单补搜或坦承不足，不硬编答案</text></g></svg>
