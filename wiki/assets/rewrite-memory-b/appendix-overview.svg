<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">技术结论的三层证据分界</title><desc id="desc">论文实验：解释设计动机与特定基准协议，不能直接外推生产；锁定 commit 源码：证明某提交在特定分支下的真实控制流与边界；实际部署实测：绑定具体模型、后端与业务语料的延迟、成本与效果</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">技术结论的三层证据分界</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">论文实验</text><text x="270" y="139" font-size="18" fill="#243b48">解释设计动机与特定基准协议，不能直接外推生产</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">锁定 commit 源码</text><text x="270" y="239" font-size="18" fill="#243b48">证明某提交在特定分支下的真实控制流与边界</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">实际部署实测</text><text x="270" y="339" font-size="18" fill="#243b48">绑定具体模型、后端与业务语料的延迟、成本与效果</text></g></svg>
