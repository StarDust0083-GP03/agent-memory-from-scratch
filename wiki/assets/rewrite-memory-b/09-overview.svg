<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">用故障演练检验项目的可接管度</title><desc id="desc">核对活跃与迁移：看当前主仓、核心作者与近期真实修复；断网断模型测试：验原事件不丢、不把超时当空结果、能安全重试；划清开源与托管边界：不拿托管云成绩替开源本地库验收</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">用故障演练检验项目的可接管度</text><circle cx="58" cy="130" r="22" fill="#285d75"/><text x="52" y="137" font-size="21" fill="white">1</text><rect x="105" y="100" width="745" height="85" fill="#e8ede7"/><text x="122" y="128" font-size="19" fill="#243b48">核对活跃与迁移</text><text x="122" y="157" font-size="18" fill="#243b48">看当前主仓、核心作者与近期真实修复</text><path d="M58 153 V182" stroke="#285d75" stroke-width="2"/><path d="M52 176 L58 185 L64 176" fill="none" stroke="#285d75" stroke-width="2"/><circle cx="58" cy="235" r="22" fill="#285d75"/><text x="52" y="242" font-size="21" fill="white">2</text><rect x="105" y="205" width="745" height="85" fill="#e8ede7"/><text x="122" y="233" font-size="19" fill="#243b48">断网断模型测试</text><text x="122" y="262" font-size="18" fill="#243b48">验原事件不丢、不把超时当空结果、能安全重试</text><path d="M58 258 V287" stroke="#285d75" stroke-width="2"/><path d="M52 281 L58 290 L64 281" fill="none" stroke="#285d75" stroke-width="2"/><circle cx="58" cy="340" r="22" fill="#285d75"/><text x="52" y="347" font-size="21" fill="white">3</text><rect x="105" y="310" width="745" height="85" fill="#e8ede7"/><text x="122" y="338" font-size="19" fill="#243b48">划清开源与托管边界</text><text x="122" y="367" font-size="18" fill="#243b48">不拿托管云成绩替开源本地库验收</text></g></svg>
