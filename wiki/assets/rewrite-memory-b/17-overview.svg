<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">上线前拿证据说话的五项验收</title><desc id="desc">源码与维护核验：锁定主仓 commit、许可证与开源托管功能边界；基线与消融对照：保留无记忆基线，证明新增组件确实减少返工；安全撤回与恢复：越权零泄漏、删除可重放、收益为负随时可干净回滚</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">上线前拿证据说话的五项验收</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">源码与维护核验</text><text x="270" y="139" font-size="18" fill="#243b48">锁定主仓 commit、许可证与开源托管功能边界</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">基线与消融对照</text><text x="270" y="239" font-size="18" fill="#243b48">保留无记忆基线，证明新增组件确实减少返工</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">安全撤回与恢复</text><text x="270" y="339" font-size="18" fill="#243b48">越权零泄漏、删除可重放、收益为负随时可干净回滚</text></g></svg>
