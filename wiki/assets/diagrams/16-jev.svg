<path d="M487 174h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="512" y="150" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="622" y="180" text-anchor="middle">有限 unjudged 回退</text>
