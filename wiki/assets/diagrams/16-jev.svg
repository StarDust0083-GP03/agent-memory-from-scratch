<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 455" role="img" aria-labelledby="title desc"><title id="title">Hermes 与 Hippo 的云判别故障路径</title><desc id="desc">Hermes 区分相关性与注入风险，Hippo 只批量重排相关性且错误整批退本地。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:15px}rect,line,path{stroke:currentColor} @media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style>
