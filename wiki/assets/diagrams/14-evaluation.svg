<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 455" role="img" aria-labelledby="title desc"><title id="title">定位四层误差，而不是只看总分</title><desc id="desc">相同 query 依次核对写入、候选、上下文与答案，每次只切换一个机制。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:15px}rect,line,path{stroke:currentColor} @media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style>
<text x="12" y="35" font-weight="600">证据检查</text>
<rect x="12" y="50" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="122" y="80" text-anchor="middle">原始来源 / 标签</text>
<path d="M237 74h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="262" y="50" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="372" y="80" text-anchor="middle">实际写入的记忆</text>
<path d="M487 74h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="512" y="50" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="622" y="80" text-anchor="middle">抽取误差</text>
<text x="12" y="135" font-weight="600">候选检查</text>
<rect x="12" y="150" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="122" y="180" text-anchor="middle">期望证据 ID</text>
<path d="M237 174h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="262" y="150" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="372" y="180" text-anchor="middle">召回 / 排序列表</text>
<path d="M487 174h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="512" y="150" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="622" y="180" text-anchor="middle">召回与排序误差</text>
<text x="12" y="235" font-weight="600">使用检查</text>
<rect x="12" y="250" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="122" y="280" text-anchor="middle">打包后的上下文</text>
<path d="M237 274h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="262" y="250" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="372" y="280" text-anchor="middle">固定 reader / 答案</text>
<path d="M487 274h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="512" y="250" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="622" y="280" text-anchor="middle">证据使用误差</text>
<text x="12" y="335" font-weight="600">任务检查</text>
<rect x="12" y="350" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="122" y="380" text-anchor="middle">有无记忆对照</text>
<path d="M237 374h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="262" y="350" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="372" y="380" text-anchor="middle">成功 / 成本 / 延迟</text>
<path d="M487 374h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="512" y="350" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="622" y="380" text-anchor="middle">真实任务收益</text>
<text x="12" y="450" style="font-size:12px">概念图：箭头表示数据或控制流，不表示所有步骤默认启用。</text></svg>