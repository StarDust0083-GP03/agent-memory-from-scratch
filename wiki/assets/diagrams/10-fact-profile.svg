<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 455" role="img" aria-labelledby="title desc"><title id="title">查询选事实与直接读画像的区别</title><desc id="desc">Mem0 把判断放在事实检索，Memobase 在写入时整理画像并保留独立事件访问。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:15px}rect,line,path{stroke:currentColor} @media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style>
<text x="12" y="35" font-weight="600">Mem0 写</text>
<rect x="12" y="50" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="122" y="80" text-anchor="middle">消息 / 近期上下文</text>
<path d="M237 74h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="262" y="50" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="372" y="80" text-anchor="middle">单次 ADD / 批量向量</text>
<path d="M487 74h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="512" y="50" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="622" y="80" text-anchor="middle">短事实 / entity</text>
<text x="12" y="135" font-weight="600">Mem0 读</text>
<rect x="12" y="150" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="122" y="180" text-anchor="middle">query / scope</text>
<path d="M237 174h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="262" y="150" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="372" y="180" text-anchor="middle">语义池多信号评分</text>
<path d="M487 174h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="512" y="150" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="622" y="180" text-anchor="middle">选中事实</text>
<text x="12" y="235" font-weight="600">Memobase 写</text>
<rect x="12" y="250" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="122" y="280" text-anchor="middle">聊天 buffer</text>
<path d="M237 274h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="262" y="250" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="372" y="280" text-anchor="middle">flush / profile merge</text>
<path d="M487 274h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="512" y="250" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="622" y="280" text-anchor="middle">画像 + 事件</text>
<text x="12" y="335" font-weight="600">Memobase 读</text>
<rect x="12" y="350" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="122" y="380" text-anchor="middle">用户 ID / 问题</text>
<path d="M237 374h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="262" y="350" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="372" y="380" text-anchor="middle">直接画像或事件搜索</text>
<path d="M487 374h19m-6-5 6 5-6 5" fill="none" stroke-width="1.5"/>
<rect x="512" y="350" width="220" height="48" rx="4" fill="none" stroke-opacity=".6"/><text x="622" y="380" text-anchor="middle">稳定属性 / 经历</text>
<text x="12" y="450" style="font-size:12px">概念图：箭头表示数据或控制流，不表示所有步骤默认启用。</text></svg>