<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" role="img" aria-labelledby="title desc"><title id="title">先检查十个案例，再读大分数：两条案例流程</title><desc id="desc">Mem0：默认语言、例外、教训十个案例 → 逐题查看提取与实际输入 → 不用别人的总分代替本地题；Graphiti：同名项目、变更、缺边案例 → 逐题检查关系与原文 → 核对你的数据是否适用。检查点：公开评测包含特定模型、数据和预算；本书离线验证不代表复现了两套服务评分。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:16px}rect{stroke-opacity:.6}@media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style><text x="12" y="26" font-weight="600">Mem0</text>
