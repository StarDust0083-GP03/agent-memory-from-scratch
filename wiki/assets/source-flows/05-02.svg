<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" role="img" aria-labelledby="title desc"><title id="title">关键词检索：认出具体词语：两条案例流程</title><desc id="desc">Mem0：问题 E42，记录也含 E42 → 已有候选得到关键词加分 → 应用检查 E42 是否先进入候选；Graphiti：关系正文含 Atlas 与 E42 → 文字搜索找到这条关系 → 按来源打开对应故障报告。检查点：Mem0 的关键词加分不会救回语义池外记录；Graphiti 找到字串后也要核对项目。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:16px}rect{stroke-opacity:.6}@media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style><text x="12" y="26" font-weight="600">Mem0</text>
<rect x="12" y="42" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="67">1. 问题 E42，记录也含 E42</text>
<path d="M180 105v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="127" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="152">2. 已有候选得到关键词加分</text>
<path d="M180 190v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="212" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="237">3. 应用检查 E42 是否先进入候选</text>
<text x="12" y="309" font-weight="600">Graphiti</text>
<rect x="12" y="325" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="350">1. 关系正文含 Atlas 与 E42</text>
