<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" role="img" aria-labelledby="title desc"><title id="title">把“感觉更聪明了”变成能检查的问题：两条案例流程</title><desc id="desc">Mem0：测试题：发布前检查什么 → 检查迁移教训是否返回并入输入 → 核对回答和动作是否采用；Graphiti：测试题：谁批准 Atlas → 查维护与正式批准两条证据 → Lin 答案必须有正确证据支持。检查点：碰巧回答正确不能证明记忆路径正确；标准答案还需要标明必要证据。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:16px}rect{stroke-opacity:.6}@media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style><text x="12" y="26" font-weight="600">Mem0</text>
<rect x="12" y="42" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="67">1. 测试题：发布前检查什么</text>
<path d="M180 105v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="127" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="152">2. 检查迁移教训是否返回并入输入</text>
<path d="M180 190v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="212" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="237">3. 核对回答和动作是否采用</text>
<text x="12" y="309" font-weight="600">Graphiti</text>
<rect x="12" y="325" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="350">1. 测试题：谁批准 Atlas</text>
<path d="M180 388v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="410" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
