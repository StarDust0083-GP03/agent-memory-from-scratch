<rect x="12" y="220" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="245">3. 检查语言、测试步骤与修改范围</text>
<text x="12" y="317" font-weight="600">Graphiti</text>
<rect x="12" y="333" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="358">1. 两文档写维护与代码评审</text>
