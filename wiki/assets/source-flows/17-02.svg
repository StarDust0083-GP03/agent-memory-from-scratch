<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 618" role="img" aria-labelledby="title desc"><title id="title">起步：把你能解释的数据路径跑通：两条案例流程</title><desc id="desc">Mem0：默认中文、跑提醒测试、改文件前确认范围 → 应用把记录加入改代码任务输入 → 检查语言、测试步骤与修改范围；Graphiti：两文档写维护与代码评审 → 应用核对两关系和原文 → 验证 Lin 答案后再扩大资料量。检查点：这是建议执行的最小验证路径；存取测试不等于生产运行和所有后端验证。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:16px}rect{stroke-opacity:.6}@media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style><text x="12" y="26" font-weight="600">Mem0</text>
<rect x="12" y="42" width="336" height="68" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="67">1. 默认中文、跑提醒测试、改文件前确</text>
<text x="28" y="89">认范围</text>
