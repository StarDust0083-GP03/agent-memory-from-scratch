<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" role="img" aria-labelledby="title desc"><title id="title">从下一次读取，反推事实库和画像库的代价：两条案例流程</title><desc id="desc">Mem0：已确认 17 号为语言偏好 → 应用每轮直接读取该记录 → 发布教训另做任务相关搜索；Graphiti：已定位规范 Alice 对象 → 应用读取其当前语言关系 → 发布任务另查 Atlas 资料。检查点：稳定必需字段不能只依赖问题相似度；当前记录的选择和版本要明确。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:16px}rect{stroke-opacity:.6}@media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style><text x="12" y="26" font-weight="600">Mem0</text>
