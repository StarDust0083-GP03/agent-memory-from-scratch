<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" role="img" aria-labelledby="title desc"><title id="title">SQLite 里面到底保存了什么：两条案例流程</title><desc id="desc">Mem0：17 号：Alice 的迁移教训 → 应用按 Alice 查、按 17 号更新 → 正文和身份都能在库中核对；Graphiti：原文、Atlas、平台组、维护边 → 分别保存材料、对象与关系 → 应用区分原文错误和连线错误。检查点：教学表字段不等于项目实际字段；身份、来源和时间需要按真实接口映射。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:16px}rect{stroke-opacity:.6}@media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style><text x="12" y="26" font-weight="600">Mem0</text>
