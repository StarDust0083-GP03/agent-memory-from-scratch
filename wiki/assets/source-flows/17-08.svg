<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" role="img" aria-labelledby="title desc"><title id="title">怎样判断一次升级应该撤回：两条案例流程</title><desc id="desc">Mem0：重排增费用但漏检未改善 → 应用保留对照测试后撤回重排 → 回查初选或范围问题；Graphiti：邻域扩展带来大量无关项目 → 应用撤回扩展并修身份或用途 → 不把更多结果当改进。检查点：升级可撤回不表示丢掉原始资料；保留失败题和来源，才能继续比较。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:16px}rect{stroke-opacity:.6}@media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style><text x="12" y="26" font-weight="600">Mem0</text>
<rect x="12" y="42" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="67">1. 重排增费用但漏检未改善</text>
<path d="M180 105v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="127" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="152">2. 应用保留对照测试后撤回重排</text>
<path d="M180 190v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="212" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="237">3. 回查初选或范围问题</text>
<text x="12" y="309" font-weight="600">Graphiti</text>
<rect x="12" y="325" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="350">1. 邻域扩展带来大量无关项目</text>
<path d="M180 388v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="410" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="435">2. 应用撤回扩展并修身份或用途</text>
<path d="M180 473v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="495" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="520">3. 不把更多结果当改进</text>
<text x="12" y="592" font-size="13">教学推演；“应用”步骤需自行实现。</text></svg>