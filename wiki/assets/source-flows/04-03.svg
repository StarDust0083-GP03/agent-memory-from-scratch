<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" role="img" aria-labelledby="title desc"><title id="title">相关性怎样算出来：两条案例流程</title><desc id="desc">Mem0：上线前核验什么？ → 按意思找到“发布前查迁移” → 对进入候选的记录评分；Graphiti：谁负责 Atlas？ → 文字和向量找到维护关系 → 应用核对负责者的具体含义。检查点：玩具词重合分不能当成真实语义评分；高分也不能证明关系含义正确。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:16px}rect{stroke-opacity:.6}@media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style><text x="12" y="26" font-weight="600">Mem0</text>
