<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" role="img" aria-labelledby="title desc"><title id="title">模型为什么没有自动记住上次对话：两条案例流程</title><desc id="desc">Mem0：昨天存了“先检查迁移” → 今天调用 search 取回教训 → 应用将教训加入本轮输入；Graphiti：昨天存了“Atlas 批准人 Lin” → 今天查询批准关系与来源 → 应用将证据交给回答模型。检查点：模型不会主动访问记忆库；数据库存在记录与本轮输入包含记录是两个状态。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:16px}rect{stroke-opacity:.6}@media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style><text x="12" y="26" font-weight="600">Mem0</text>
