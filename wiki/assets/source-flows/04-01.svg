<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 618" role="img" aria-labelledby="title desc"><title id="title">先做一个不调用模型的记忆实验：两条案例流程</title><desc id="desc">Mem0：失败原话：昨天漏跑提醒测试 → Mem0 可提取“提交代码前跑提醒测试” → 应用核验“查”未变成“重跑”；Graphiti：文档：Todo 由前端组维护 → Graphiti 提取项目和维护关系 → 应用检查两端是否正确。检查点：本章 SQLite 实验直接存已写好的文字，不包含两套真实服务的模型提取步骤。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:16px}rect{stroke-opacity:.6}@media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style><text x="12" y="26" font-weight="600">Mem0</text>
<rect x="12" y="42" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="67">1. 失败原话：昨天漏跑提醒测试</text>
<path d="M180 105v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="127" width="336" height="68" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="152">2. Mem0 可提取“提交代码前跑提醒测试</text>
<text x="28" y="174">”</text>
<path d="M180 198v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="220" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="245">3. 应用核验“查”未变成“重跑”</text>
<text x="12" y="317" font-weight="600">Graphiti</text>
<rect x="12" y="333" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="358">1. 文档：Todo 由前端组维护</text>
<path d="M180 396v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="418" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="443">2. Graphiti 提取项目和维护关系</text>
<path d="M180 481v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="503" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="528">3. 应用检查两端是否正确</text>
<text x="12" y="600" font-size="13">教学推演；“应用”步骤需自行实现。</text></svg>