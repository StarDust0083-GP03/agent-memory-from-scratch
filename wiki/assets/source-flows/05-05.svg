<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" role="img" aria-labelledby="title desc"><title id="title">RRF：用名次合并，避免直接相加不同分数：两条案例流程</title><desc id="desc">Mem0：A 的分数为 0.8、0.5、0.2 → 三信号启用时按实现除以 2.5 → 合分 0.6，不是可信概率；Graphiti：A 两榜第 1、第 2；B 均第 3 → 此快照按 1、1/2、1/3 累加 → A 得 1.5，B 约 0.67。检查点：Mem0 算例的合分与 Graphiti 的名次融合不是同一公式；参数必须与所用快照一致。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:16px}rect{stroke-opacity:.6}@media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style><text x="12" y="26" font-weight="600">Mem0</text>
<rect x="12" y="42" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="67">1. A 的分数为 0.8、0.5、0.2</text>
<path d="M180 105v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="127" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="152">2. 三信号启用时按实现除以 2.5</text>
<path d="M180 190v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="212" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="237">3. 合分 0.6，不是可信概率</text>
<text x="12" y="309" font-weight="600">Graphiti</text>
<rect x="12" y="325" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="350">1. A 两榜第 1、第 2；B 均第 3</text>
<path d="M180 388v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="410" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="435">2. 此快照按 1、1/2、1/3 累加</text>
<path d="M180 473v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="495" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="520">3. A 得 1.5，B 约 0.67</text>
<text x="12" y="592" font-size="13">教学推演；“应用”步骤需自行实现。</text></svg>