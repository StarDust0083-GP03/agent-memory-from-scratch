<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 618" role="img" aria-labelledby="title desc"><title id="title">一段话里，其实有四种不同的信息：两条案例流程</title><desc id="desc">Mem0：默认中文，今天只读排查，先跑提醒测试 → 应用保存三条并标明任务范围 → 任务结束后排除今日只读排查要求；Graphiti：Alice 偏好、今日任务、Todo → 分别整理偏好与两种要求 → 查询长期要求时排除旧任务。检查点：提取器不一定正确拆分；“今天”一旦丢失，临时要求就可能被当成长久规则。</desc><style>svg{color:#29564c;font-family:system-ui,sans-serif}text{fill:currentColor;font-size:16px}rect{stroke-opacity:.6}@media(prefers-color-scheme:dark){svg{color:#87b7a8}}</style><text x="12" y="26" font-weight="600">Mem0</text>
<rect x="12" y="42" width="336" height="68" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="67">1. 默认中文，今天只读排查，先跑提醒</text>
<text x="28" y="89">测试</text>
<path d="M180 113v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="135" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="160">2. 应用保存三条并标明任务范围</text>
<path d="M180 198v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="220" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="245">3. 任务结束后排除今日只读排查要求</text>
<text x="12" y="317" font-weight="600">Graphiti</text>
<rect x="12" y="333" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="358">1. Alice 偏好、今日任务、Todo</text>
<path d="M180 396v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="418" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="443">2. 分别整理偏好与两种要求</text>
<path d="M180 481v16m-5-5 5 5 5-5" fill="none" stroke="currentColor"/>
<rect x="12" y="503" width="336" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="28" y="528">3. 查询长期要求时排除旧任务</text>
<text x="12" y="600" font-size="13">教学推演；“应用”步骤需自行实现。</text></svg>