<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 388" role="img" aria-labelledby="valid-time-title valid-time-desc">
<title id="valid-time-title">生效日与录入日是两回事</title>
<desc id="valid-time-desc">Todo 的默认包管理器在9月18日由 npm 改为 pnpm，系统9月20日才收到消息；9月15日的现实默认是 npm，9月19日的现实默认是 pnpm，但系统19日可能尚不知道。</desc>
<style>svg{--paper:#faf7ef;--ink:#252820;--muted:#696b61;--accent:#29564c;--rule:#d9d2c3;color:var(--ink);font-family:system-ui,sans-serif}text{fill:currentColor;font-size:20px}path,line,rect,circle,ellipse{stroke:currentColor;stroke-width:1.5} .small{font-size:17px;fill:var(--muted)}.focal{color:var(--accent)}.paper{fill:var(--paper)}.rule{stroke:var(--rule)}@media(prefers-color-scheme:dark){svg{--paper:#151512;--ink:#e5e0d5;--muted:#aaa79d;--accent:#87b7a8;--rule:#39382f}}</style>
<defs><marker id="valid-time-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="context-stroke"/></marker></defs>

<text x="24" y="32" text-anchor="start" class="">现实：什么时候成立？</text>
<path class="rule" d="M56 100H400" fill="none"/>
<path d="M56 100H331.2" style="stroke-width:8" fill="none"/>
<path class="focal" d="M331.2 100H400" style="stroke-width:8" fill="none"/>
<text x="56" y="80" text-anchor="start" class="small">npm</text><text x="340" y="80" text-anchor="start" class="small">pnpm</text>
<path d="M331.2 88V116" fill="none"/>
<text x="56" y="136" text-anchor="middle" class="small">9/10</text><text x="228" y="136" text-anchor="middle" class="small">9/15</text><text x="331.2" y="136" text-anchor="middle" class="small">9/18</text><text x="400" y="136" text-anchor="middle" class="small">9/20</text>
<text x="24" y="200" text-anchor="start" class="">系统：什么时候知道？</text>
<path class="rule" d="M56 232H400" fill="none"/>
<circle cx="400" cy="232" r="5" fill="currentColor"/>
<text x="388" y="264" text-anchor="end" class="small">9/20 收到变更</text>
<text x="24" y="320" text-anchor="start" class="">查 9/15 的规则 → npm</text>
<text x="24" y="354" text-anchor="start" class="">查 9/19 的规则 → pnpm</text>

</svg>
